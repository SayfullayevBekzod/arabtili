<!doctype html>
<html lang="uz">

<head>
    <meta charset="utf-8">
    <title>Uyga Vazifa | AlifPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#020617">
    <link rel="icon" type="image/svg+xml" href="/static/img/logo_alifpro.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            overflow-x: hidden;
            background-color: #020617;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #020617;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 2px solid #020617;
        }
    </style>
</head>

<body class="bg-slate-950 text-white selection:bg-emerald-400/30">

    <div class="max-w-3xl mx-auto py-8 px-4 pb-24" id="app">

        <div id="loading" class="text-center py-12">
            <div class="text-indigo-500 text-xl animate-pulse">Yuklanmoqda...</div>
        </div>

        <!-- Content Container -->
        <div id="content" class="hidden">
            <!-- Back -->
            <a href="/homework/" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition mb-6">
                <i class="fas fa-arrow-left"></i> Orqaga
            </a>

            <!-- Main Card -->
            <div class="bg-slate-900/50 border border-white/5 rounded-3xl overflow-hidden backdrop-blur-md">

                <!-- Header -->
                <div class="p-6 md:p-8 border-b border-white/5 bg-white/5 relative">
                    <div
                        class="absolute top-0 right-0 p-6 opacity-10 text-9xl leading-none select-none pointer-events-none">
                        📝</div>

                    <div class="flex items-center gap-3 mb-4">
                        <span id="hw-level"
                            class="px-3 py-1 rounded-lg bg-indigo-500/20 text-indigo-400 text-xs font-black uppercase tracking-widest border border-indigo-500/20"></span>
                    </div>

                    <h1 id="hw-title" class="text-3xl md:text-4xl font-black text-white mb-4 leading-tight"></h1>

                    <div class="flex flex-wrap gap-6 text-sm font-medium text-slate-400">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-calendar text-indigo-400"></i>
                            Deadline: <span id="hw-deadline" class="text-white"></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-star text-amber-400"></i>
                            Mukofot: <span id="hw-xp" class="text-white"></span>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div class="p-6 md:p-8 space-y-6">
                    <div id="hw-description"
                        class="prose prose-invert max-w-none text-base leading-relaxed text-slate-300 whitespace-pre-wrap">
                    </div>

                    <hr class="border-white/5">

                    <!-- Submission Area -->
                    <div>
                        <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                            <i class="fas fa-paper-plane text-emerald-400"></i> Javob yuborish
                        </h3>

                        <div id="status-message" class="hidden mb-4 p-4 rounded-xl border"></div>

                        <form id="submission-form" method="post" enctype="multipart/form-data" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-400 mb-2">Matnli javob
                                    (ixtiyoriy)</label>
                                <textarea id="inp-text" name="text_content" rows="4"
                                    class="w-full bg-slate-950 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-indigo-500 transition"
                                    placeholder="Javobingizni shu yerga yozing..."></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-400 mb-2">Fayl yuklash (PDF, Rasm,
                                    ZIP)</label>
                                <input id="inp-file" type="file" name="file"
                                    class="w-full bg-slate-950 border border-white/10 rounded-xl p-3 text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-500/20 file:text-indigo-400 hover:file:bg-indigo-500/30 transition">
                            </div>
                            <button type="submit"
                                class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black uppercase tracking-widest rounded-xl transition shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
                                <i class="fas fa-paper-plane"></i> Javobni Yuborish
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Extract ID from URL /homework/<id>/
            const pathParts = window.location.pathname.split('/').filter(p => p);
            const id = pathParts[pathParts.length - 1]; // Assume last part is ID

            if (!id) return;

            fetch(`/homework/api/detail/${id}/`)
                .then(res => res.json())
                .then(data => {
                    const loading = document.getElementById('loading');
                    const content = document.getElementById('content');

                    loading.classList.add('hidden');
                    content.classList.remove('hidden');

                    document.title = `${data.title} | Uyga Vazifa`;
                    document.getElementById('hw-title').textContent = data.title;
                    document.getElementById('hw-level').textContent = data.level;
                    document.getElementById('hw-deadline').textContent = new Date(data.deadline).toLocaleDateString();
                    document.getElementById('hw-xp').textContent = `${data.xp_reward} XP`;
                    document.getElementById('hw-description').textContent = data.description;

                    // Set Form Action
                    const form = document.getElementById('submission-form');
                    form.action = `/homework/submit/${data.id}/`;

                    // Inject CSRF
                    function getCookie(name) {
                        let cookieValue = null;
                        if (document.cookie && document.cookie !== '') {
                            const cookies = document.cookie.split(';');
                            for (let i = 0; i < cookies.length; i++) {
                                const cookie = cookies[i].trim();
                                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                                    break;
                                }
                            }
                        }
                        return cookieValue;
                    }
                    const csrftoken = getCookie('csrftoken');
                    if (csrftoken) {
                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = 'csrfmiddlewaretoken';
                        input.value = csrftoken;
                        form.appendChild(input);
                    }

                    // Handle Status
                    const statusMsg = document.getElementById('status-message');
                    const inpText = document.getElementById('inp-text');

                    if (data.status !== 'new' && data.status !== 'rejected') {
                        // Disable form if submitted/graded
                        statusMsg.classList.remove('hidden');
                        statusMsg.classList.add(data.status === 'graded' ? 'bg-emerald-500/10' : 'bg-amber-500/10', data.status === 'graded' ? 'border-emerald-500/30' : 'border-amber-500/30', data.status === 'graded' ? 'text-emerald-400' : 'text-amber-400');
                        statusMsg.innerHTML = `<strong>Holat: ${data.status.toUpperCase()}</strong><br>Siz javob yuborgansiz.`;

                        form.querySelector('button').disabled = true;
                        form.querySelector('button').classList.add('opacity-50', 'cursor-not-allowed');

                        // Show previous text
                        if (data.text_content) inpText.value = data.text_content;
                        inpText.disabled = true;
                    } else if (data.status === 'rejected') {
                        statusMsg.classList.remove('hidden');
                        statusMsg.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
                        statusMsg.innerHTML = `<strong>Rad etildi</strong><br>O'qituvchi fikri: ${data.admin_feedback || ''}<br>Iltimos, qayta yuboring.`;
                    }

                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loading').innerHTML = '<div class="text-red-500">Xatolik.</div>';
                });
        });
    </script>

</body>

</html>
